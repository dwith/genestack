---

cinder_release_branch: "stable/2026.1"
storage_network_interface: ansible_br_storage
storage_network_interface_secondary:
cinder_backend_name: ""
cinder_worker_name: "netapp" # Other possibilities: lvm, storage (non NetApp)

cinder_virtualenv_path: "/opt/cinder"
storage_network_multipath: false
cinder_enable_storage_ssl: false
cinder_storage_cert_src_dir: "/opt/genestack/ansible/playbooks/templates/"
cinder_storage_cert_filenames:
  - "ontap-cluster-host.crt"
  - "ontap-vserver-host.crt"

cinder_volume_package_state: latest

# Rust toolchain configuration for cinder-rxt snapshot worker
cinder_rxt_rust_install: true
cinder_rxt_rust_version: "1.99.0"
cinder_rxt_rust_user: "root"
cinder_rxt_rustup_home: "/opt/rust/rustup"
cinder_rxt_cargo_home: "/opt/rust/cargo"
cinder_rxt_rustup_installer_url: "https://sh.rustup.rs"
cinder_rxt_git_repo: "https://github.com/dwith/cinder-rxt.git"
cinder_rxt_git_version: "lvm-fork-encryption"

# RXT snapshot and volume driver safeguards (Dedicated LVM Storage Nodes)
cinder_rxt_swift_snapshots_enabled: true
cinder_rxt_max_concurrent_clones: 2
cinder_rxt_max_concurrent_snapshots: 4
cinder_rxt_clone_concurrency: 8
cinder_rxt_snapshot_concurrency: 32
cinder_rxt_worker_ionice_class: 0
cinder_rxt_worker_ionice_level: 4
cinder_rxt_worker_nice_priority: 0
cinder_rxt_copy_max_mbps: 0
cinder_rxt_snapshot_max_mbps: 0


