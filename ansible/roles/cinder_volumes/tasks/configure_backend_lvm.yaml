---

- name: Set LVM backend fact
  ansible.builtin.set_fact:
    cinder_backend: |
      {% set rendered_backend = {} %}
      {% for backend in cinder_backend_name.split(',') %}
      {%   set default_backend = (_kubernetes_cinder_etc_secret.resources[0].data['backends.conf'] | b64decode | community.general.from_ini)[backend] %}
      {%   set network_interface = hostvars[inventory_hostname][storage_network_interface]['ipv4']['address'] | default(ansible_default_ipv4.address) %}
      {%   set _ = default_backend.__setitem__("target_ip_address", network_interface) %}
      {%   if ("lvm" in backend) and (storage_network_multipath | bool) %}
      {%       set network_interface_secondary = hostvars[inventory_hostname][storage_network_interface_secondary]['ipv4']['address'] %}
      {%       set _ = default_backend.__setitem__("iscsi_secondary_ip_addresses", network_interface_secondary) %}
      {%   endif %}
      {%   if default_backend.get("volume_driver", "").startswith("cinder_rxt.") %}
      {%       set _ = default_backend.__setitem__("rxt_swift_snapshots_enabled", "true") %}
      {%   endif %}
      {%   set _ = rendered_backend.__setitem__(backend, default_backend) %}
      {% endfor %}
      {{ rendered_backend }}

- name: Create the cinder-volume backend configuration
  ansible.builtin.copy:
    content: "{{ cinder_backend | community.general.to_ini }}"
    dest: "/etc/cinder/backends.conf"
    owner: root
    group: cinder
    mode: "0640"
  notify:
    - Restart cinder-volume and cinder-backup systemd services

- name: Create the LVM worker configuration override
  ansible.builtin.copy:
    content: |
      [DEFAULT]
      host = {{ inventory_hostname }}
      enabled_backends = {{ cinder_backend_name }}
      {% if cinder_rxt_swift_snapshots_enabled is defined %}

      # RXT Decoupled Snapshot & Volume Driver Safeguards and Resource Controls
      rxt_swift_snapshots_enabled = {{ cinder_rxt_swift_snapshots_enabled | lower }}
      rxt_max_concurrent_clones = {{ cinder_rxt_max_concurrent_clones }}
      rxt_max_concurrent_snapshots = {{ cinder_rxt_max_concurrent_snapshots }}
      rxt_clone_concurrency = {{ cinder_rxt_clone_concurrency }}
      rxt_snapshot_concurrency = {{ cinder_rxt_snapshot_concurrency }}
      rxt_worker_ionice_class = {{ cinder_rxt_worker_ionice_class }}
      rxt_worker_ionice_level = {{ cinder_rxt_worker_ionice_level }}
      rxt_worker_nice_priority = {{ cinder_rxt_worker_nice_priority }}
      rxt_copy_max_mbps = {{ cinder_rxt_copy_max_mbps }}
      rxt_snapshot_max_mbps = {{ cinder_rxt_snapshot_max_mbps }}
      {% endif %}

      [oslo_concurrency]
      lock_path = /var/lock/cinder

      [os_brick]
      lock_path = /var/lock/cinder
    dest: "/etc/cinder/lvm-cinder.conf"
    owner: root
    group: cinder
    mode: "0640"
  notify:
    - Restart cinder-volume and cinder-backup systemd services

- name: Create the cinder tgtd integration
  ansible.builtin.copy:
    content: |
      include /var/lib/cinder/volumes/*
    dest: /etc/tgt/conf.d/cinder.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload cinder-volume-tgt systemd service

- name: "Create the cinder-volume systemd service units"
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode | default('0644') }}"
  loop:
    - src: "../templates/cinder-volume-usage-audit.timer"
      dest: "/etc/systemd/system/cinder-volume-usage-audit.timer"
    - src: "../templates/cinder-volume-usage-audit.service"
      dest: "/etc/systemd/system/cinder-volume-usage-audit.service"
    - src: "../templates/cinder-volume.service"
      dest: "/etc/systemd/system/cinder-volume.service"
    - src: "../templates/cinder-backup.service"
      dest: "/etc/systemd/system/cinder-backup.service"
    - src: "../templates/sudoers"
      dest: /etc/sudoers.d/cinder-volume
      mode: "0440"
  notify:
    - Restart cinder-volume and cinder-backup systemd services
