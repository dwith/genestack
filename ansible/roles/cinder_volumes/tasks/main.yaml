---

- name: Gather variables for each operating system
  ansible.builtin.include_vars: "{{ lookup('first_found', params) }}"
  vars:
    params:
      files:
        - "{{ ansible_facts['distribution'] | lower }}-{{ ansible_facts['distribution_version'] | lower }}.yaml"
        - "{{ ansible_facts['distribution'] | lower }}-{{ ansible_facts['distribution_major_version'] | lower }}.yaml"
        - "{{ ansible_facts['os_family'] | lower }}-{{ ansible_facts['distribution_major_version'] | lower }}.yaml"
        - "{{ ansible_facts['distribution'] | lower }}.yaml"
        - "{{ ansible_facts['os_family'] | lower }}.yaml"
      paths:
        - "{{ role_path }}/vars"
  tags:
    - always

- ansible.builtin.debug:
    msg:
      - "Configuring backend: {{ cinder_backend_name }}"
      - "Configuring worker: {{ cinder_worker_name }}"

- ansible.builtin.debug:
    msg:
      - "Multipath: {{ storage_network_multipath }}"
  when:
    - cinder_worker_name | lower == "lvm"

- ansible.builtin.debug:
    msg:
      - "Client SSL Cert: {{ cinder_enable_storage_ssl }}"
      - "Client SSL Dir: {{ cinder_storage_cert_src_dir }}"
      - "Client SSL Certs: {{ cinder_storage_cert_filenames }}"
  when:
    - cinder_worker_name | lower != "lvm"

- name: Wait for apt/dpkg locks to be released
  ansible.builtin.shell: |
    while fuser /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock /var/cache/apt/archives/lock >/dev/null 2>&1; do
      echo "apt/dpkg lock held, waiting..."
      sleep 5
    done
  changed_when: false
  when:
    - ansible_facts['os_family'] | lower == 'debian'

# run_once: every host in the play delegates this block to the first
# control-plane node; without it, N parallel apt-get invocations race each
# other for the dpkg lock on that one node (only one wins). The registered
# secret result is propagated to all play hosts by run_once.
- name: K8S Facts block
  delegate_to: "{{ groups['kube_control_plane'][0] }}"
  run_once: true
  block:
    - name: Ensure python3-kubernetes is available
      ansible.builtin.package:
        name: python3-kubernetes
        state: present
        update_cache: true
      register: _py3_kubernetes_install
      until: _py3_kubernetes_install is success
      retries: 20
      delay: 5

    - name: Read cinder-etc secrets
      kubernetes.core.k8s_info:
        kind: Secret
        name: cinder-etc
        namespace: openstack
      register: _kubernetes_cinder_etc_secret

    - name: Read cinder-ks-etc secrets
      kubernetes.core.k8s_info:
        kind: Secret
        name: cinder-ks-etc
        namespace: openstack
      register: _kubernetes_cinder_ks_etc_secret

    - name: Read cinder-keystone-admin secrets
      kubernetes.core.k8s_info:
        kind: Secret
        name: cinder-keystone-admin
        namespace: openstack
      register: _kubernetes_cinder_keystone_admin_secret

    - name: Resolve internal tenant project and user IDs from Keystone
      ansible.builtin.command:
        cmd: >-
          python3 -c "
          import json, sys, urllib.request
          auth_url = sys.argv[1].rstrip('/')
          if not auth_url.endswith('/v3'):
              auth_url = f'{auth_url}/v3'
          user, pw = sys.argv[2], sys.argv[3]
          p_name = sys.argv[4] or 'service'
          u_domain = sys.argv[5] or 'Default'
          p_domain = sys.argv[6] or 'Default'
          t_proj = sys.argv[7]
          t_user = sys.argv[8]
          auth_body = json.dumps({
              'auth': {
                  'identity': {
                      'methods': ['password'],
                      'password': {
                          'user': {
                              'name': user,
                              'domain': {'name': u_domain},
                              'password': pw
                          }
                      }
                  },
                  'scope': {
                      'project': {
                          'name': p_name,
                          'domain': {'name': p_domain}
                      }
                  }
              }
          }).encode('utf-8')
          req = urllib.request.Request(f'{auth_url}/auth/tokens', data=auth_body, headers={'Content-Type': 'application/json'})
          with urllib.request.urlopen(req, timeout=15) as resp:
              token = resp.headers.get('X-Subject-Token')
          req_p = urllib.request.Request(f'{auth_url}/projects?name={t_proj}', headers={'X-Auth-Token': token})
          with urllib.request.urlopen(req_p, timeout=15) as resp:
              p_data = json.loads(resp.read().decode('utf-8'))
              p_id = p_data['projects'][0]['id'] if p_data.get('projects') else ''
          req_u = urllib.request.Request(f'{auth_url}/users?name={t_user}', headers={'X-Auth-Token': token})
          with urllib.request.urlopen(req_u, timeout=15) as resp:
              u_data = json.loads(resp.read().decode('utf-8'))
              u_id = u_data['users'][0]['id'] if u_data.get('users') else ''
          print(f'{p_id}:{u_id}')
          "
          "{{ _kubernetes_cinder_keystone_admin_secret.resources[0].data['OS_AUTH_URL'] | b64decode }}"
          "{{ _kubernetes_cinder_keystone_admin_secret.resources[0].data['OS_USERNAME'] | b64decode }}"
          "{{ _kubernetes_cinder_keystone_admin_secret.resources[0].data['OS_PASSWORD'] | b64decode }}"
          "{{ (_kubernetes_cinder_keystone_admin_secret.resources[0].data['OS_PROJECT_NAME'] | default('')) | b64decode }}"
          "{{ (_kubernetes_cinder_keystone_admin_secret.resources[0].data['OS_USER_DOMAIN_NAME'] | default('')) | b64decode }}"
          "{{ (_kubernetes_cinder_keystone_admin_secret.resources[0].data['OS_PROJECT_DOMAIN_NAME'] | default('')) | b64decode }}"
          "{{ cinder_internal_project_name }}"
          "{{ cinder_internal_user_name }}"
      register: _internal_tenant_lookup
      changed_when: false
      failed_when: false
      when:
        - cinder_enable_internal_tenant | bool
        - (cinder_internal_tenant_project_id | default('') | length == 0) or (cinder_internal_tenant_user_id | default('') | length == 0)
        - _kubernetes_cinder_keystone_admin_secret.resources | default([]) | length > 0


- name: Install cinder distro packages
  ansible.builtin.package:
    name: "{{ cinder_volume_package_list }}"
    state: "{{ cinder_volume_package_state }}"
    update_cache: true
  when:
    - cinder_volume_package_list | length > 0
  register: install_packages
  until: install_packages is success
  retries: 20
  delay: 5

- name: Install cinder-backend distro packages
  ansible.builtin.package:
    name: "{{ cinder_backend_packages[ cinder_worker_name ] }}"
    state: "{{ cinder_volume_package_state }}"
    update_cache: true
  when:
    - cinder_volume_package_list | length > 0
  register: install_backend_packages
  until: install_backend_packages is success
  retries: 20
  delay: 5

- name: Determine iscsi initiator name
  set_fact:
    initiator_name: >
      {% set _iqn = "iqn.2004-10.com." + ansible_distribution |lower() + ":" + ansible_hostname -%}
      {% if ansible_iscsi_iqn is defined -%}
      {% if (ansible_iscsi_iqn |length >= 15) -%}
      {% set _iqn = ansible_iscsi_iqn  -%}
      {% endif -%}
      {% endif -%}
      {{ _iqn }}

- name: Set iscsi initiator name if not set
  ansible.builtin.lineinfile:
    path: /etc/iscsi/initiatorname.iscsi
    regexp: '^InitiatorName=.*|^GenerateName=.*'
    line: "InitiatorName={{ initiator_name }}"

- name: Configure SSL certificate for storage API access
  ansible.builtin.include_tasks: configure_storage_certificate.yaml
  when:
    - cinder_worker_name | lower != "lvm"

- name: Install and verify Rust toolchain for cinder-rxt
  ansible.builtin.include_tasks: install_rust.yaml
  when:
    - cinder_rxt_rust_install | default(true) | bool

- name: Upgrade pip and install required packages
  ansible.builtin.pip:
    name:
      - pip
      - pymysql
      - "git+https://github.com/openstack/cinder@{{ cinder_release_branch }}"
      - "git+{{ cinder_rxt_git_repo }}@{{ cinder_rxt_git_version }}"
    state: present
    virtualenv: "{{ cinder_virtualenv_path }}"
    virtualenv_command: python3 -m venv
    extra_args: "-c https://releases.openstack.org/constraints/upper/{{ cinder_release_branch | regex_replace('^(stable|unmaintained)/', '') }}"

- name: Clone cinder-rxt repository for native snapshot worker compilation
  ansible.builtin.git:
    repo: "{{ cinder_rxt_git_repo }}"
    dest: /opt/cinder-rxt-src
    version: "{{ cinder_rxt_git_version }}"
    force: true
  register: _cinder_rxt_repo

- name: Check if cinder-rxt-worker binary exists
  ansible.builtin.stat:
    path: /usr/local/bin/cinder-rxt-worker
  register: _worker_bin_stat

- name: Compile cinder-rxt-worker release binary
  ansible.builtin.command:
    cmd: /usr/local/bin/cargo build --release
    chdir: /opt/cinder-rxt-src
  environment:
    RUSTUP_HOME: "{{ cinder_rxt_rustup_home }}"
    CARGO_HOME: "{{ cinder_rxt_cargo_home }}"
    PATH: "{{ cinder_rxt_cargo_home }}/bin:/usr/local/bin:{{ ansible_env.PATH }}"
  when: _cinder_rxt_repo.changed or not _worker_bin_stat.stat.exists

- name: Install cinder-rxt-worker binary to /usr/local/bin and virtualenv
  ansible.builtin.copy:
    src: /opt/cinder-rxt-src/target/release/cinder-rxt-worker
    dest: "{{ item }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  loop:
    - /usr/local/bin/cinder-rxt-worker
    - "{{ cinder_virtualenv_path }}/bin/cinder-rxt-worker"

- name: Check and verify cinder-rxt-worker binary execution
  ansible.builtin.command: /usr/local/bin/cinder-rxt-worker --help
  register: _worker_check
  changed_when: false
  failed_when: _worker_check.rc != 0


- name: "Get Python site-packages path from virtualenv"
  command: "{{ cinder_virtualenv_path }}/bin/python -c 'import site; print(site.getsitepackages()[0])'"
  register: venv_site
  changed_when: false

- name: "Normalize site-packages path"
  set_fact:
    venv_site_packages: "{{ venv_site.stdout | trim }}"

- name: "Ensure site-packages exists"
  file:
    path: "{{ venv_site_packages }}"
    state: directory
  when: venv_site_packages != ""

- name: Install eventlet SSL patch
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode | default('0644') }}"
  loop:
    - src: "../templates/zzz_eventlet_ssl_patch.pth"
      dest: "{{ venv_site_packages }}/zzz_eventlet_ssl_patch.pth"
      mode: "0644"
    - src: "../templates/eventlet_ssl_patch.py"
      dest: "{{ venv_site_packages }}/eventlet_ssl_patch.py"
      mode: "0644"
  when:
    - cinder_worker_name | lower != "lvm"

- name: Create the cinder system user
  ansible.builtin.user:
    name: cinder
    comment: Cinder system user
    shell: /bin/false
    system: true
    createhome: true
    home: /var/lib/cinder
    groups: disk
    append: true

- name: Create the cinder system group
  ansible.builtin.group:
    name: cinder
    system: true

- name: Create the cinder service directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: cinder
    group: cinder
    mode: "0755"
  loop:
    - /var/lib/cinder/backup
    - /var/lib/cinder/tmp
    - /var/lib/cinder/volumes
    - /var/lib/cinder/conversion
    - /var/lock/cinder

- name: Create systemd-tmpfiles configuration for cinder lock_path
  ansible.builtin.copy:
    content: |
      d /run/lock/cinder 0755 cinder cinder -
    dest: /etc/tmpfiles.d/cinder.conf
    owner: root
    group: root
    mode: "0644"

- name: Create the cinder configuration directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('cinder') }}"
    group: "{{ item.group | default('cinder') }}"
    mode: "{{ item.mode | default('0750') }}"
  loop:
    - { path: "/opt/cinder/etc/cinder", mode: "0750" }
    - { path: "/opt/cinder/etc/cinder/cinder.conf.d", mode: "0750" }
    - { path: "/opt/cinder/etc/cinder/rootwrap.d", mode: "0755", owner: "root", group: "root" }

- name: Create symlink for the etc directory
  ansible.builtin.file:
    src: /opt/cinder/etc/cinder
    dest: /etc/cinder
    state: link
    owner: cinder
    group: cinder

- name: Create the base cinder-volume configuration
  ansible.builtin.copy:
    content: "{{ _kubernetes_cinder_etc_secret.resources[0].data['cinder.conf'] | b64decode }}"
    dest: /etc/cinder/cinder.conf
    owner: root
    group: cinder
    mode: "0640"
  notify:
    - "restart cinder services"

- name: Deploy modular snippets from cinder-ks-etc into cinder.conf.d
  ansible.builtin.copy:
    content: "{{ item.value | b64decode }}"
    dest: "/etc/cinder/cinder.conf.d/{{ item.key }}"
    owner: root
    group: cinder
    mode: "0640"
  loop: "{{ (_kubernetes_cinder_ks_etc_secret.resources[0].data | default({})) | dict2items }}"
  when:
    - _kubernetes_cinder_ks_etc_secret.resources | default([]) | length > 0
  notify:
    - "restart cinder services"

- name: Configure cinder lock_path
  ansible.builtin.copy:
    content: |
      [oslo_concurrency]
      lock_path = /var/lock/cinder

      [os_brick]
      lock_path = /var/lock/cinder
    dest: /etc/cinder/cinder.conf.d/lock_path.conf
    owner: root
    group: cinder
    mode: "0640"
  notify:
    - "restart cinder services"

- name: Set internal tenant facts
  ansible.builtin.set_fact:
    cinder_internal_tenant_project_id: "{{ cinder_internal_tenant_project_id if (cinder_internal_tenant_project_id | default('') | length > 0) else ((_internal_tenant_lookup.stdout | default(':')).split(':')[0]) }}"
    cinder_internal_tenant_user_id: "{{ cinder_internal_tenant_user_id if (cinder_internal_tenant_user_id | default('') | length > 0) else ((_internal_tenant_lookup.stdout | default(':')).split(':')[1]) }}"
  when:
    - cinder_enable_internal_tenant | bool
    - _internal_tenant_lookup is defined
    - _internal_tenant_lookup.stdout is defined
    - "':' in _internal_tenant_lookup.stdout"

- name: Configure cinder internal tenant and image-volume cache
  ansible.builtin.copy:
    content: |
      [DEFAULT]
      cinder_internal_tenant_project_id = {{ cinder_internal_tenant_project_id }}
      cinder_internal_tenant_user_id = {{ cinder_internal_tenant_user_id }}
      image_volume_cache_enabled = {{ cinder_image_volume_cache_enabled | bool }}
      image_volume_cache_max_size_gb = {{ cinder_image_volume_cache_max_size_gb }}
      image_volume_cache_max_count = {{ cinder_image_volume_cache_max_count }}
    dest: /etc/cinder/cinder.conf.d/internal_tenant.conf
    owner: root
    group: cinder
    mode: "0640"
  when:
    - cinder_enable_internal_tenant | bool
    - cinder_internal_tenant_project_id | default('') | length > 0
    - cinder_internal_tenant_user_id | default('') | length > 0
  notify:
    - "restart cinder services"

- name: Configure cinder glance service authentication
  ansible.builtin.copy:
    content: |
      [glance]
      auth_type = password
      auth_url = {{ _kubernetes_cinder_keystone_admin_secret.resources[0].data['OS_AUTH_URL'] | b64decode }}
      username = {{ _kubernetes_cinder_keystone_admin_secret.resources[0].data['OS_USERNAME'] | b64decode }}
      password = {{ _kubernetes_cinder_keystone_admin_secret.resources[0].data['OS_PASSWORD'] | b64decode }}
      user_domain_name = {{ (_kubernetes_cinder_keystone_admin_secret.resources[0].data.get('OS_USER_DOMAIN_NAME', '') | b64decode) | default('Default', true) }}
      project_name = {{ (_kubernetes_cinder_keystone_admin_secret.resources[0].data.get('OS_PROJECT_NAME', '') | b64decode) | default('service', true) }}
      project_domain_name = {{ (_kubernetes_cinder_keystone_admin_secret.resources[0].data.get('OS_PROJECT_DOMAIN_NAME', '') | b64decode) | default('Default', true) }}
      {% if 'OS_REGION_NAME' in _kubernetes_cinder_keystone_admin_secret.resources[0].data and (_kubernetes_cinder_keystone_admin_secret.resources[0].data['OS_REGION_NAME'] | b64decode | length > 0) %}
      region_name = {{ _kubernetes_cinder_keystone_admin_secret.resources[0].data['OS_REGION_NAME'] | b64decode }}
      {% endif %}
    dest: /etc/cinder/cinder.conf.d/glance.conf
    owner: root
    group: cinder
    mode: "0640"
  when:
    - cinder_enable_glance | bool
    - _kubernetes_cinder_keystone_admin_secret.resources | default([]) | length > 0
  notify:
    - "restart cinder services"


- name: Create the cinder-volume filters and logging configuration
  ansible.builtin.copy:
    content: "{{ _kubernetes_cinder_etc_secret.resources[0].data[item.src] | b64decode }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - src: "logging.conf"
      dest: /etc/cinder/logging.conf
    - src: "volume.filters"
      dest: /etc/cinder/rootwrap.d/volume.filters
    - src: "rootwrap.conf"
      dest: /etc/cinder/rootwrap.conf

- name: Replace exec path in rootwrap
  community.general.ini_file:
    path: /etc/cinder/rootwrap.conf
    section: DEFAULT
    option: "{{ item.key }}"
    value: "{{ item.value }}"
    create: true
  loop:
    - key: "exec_dirs"
      value: "{{ cinder_virtualenv_path }}/bin,/sbin,/usr/sbin,/bin,/usr/bin,/usr/local/bin,/usr/local/sbin,/usr/lpp/mmfs/bin"
    - key: "filters_path"
      value: "/etc/cinder/rootwrap.d"

- name: Configure storage backend
  ansible.builtin.include_tasks: configure_backend.yaml
  when:
    - cinder_worker_name | lower != "lvm"

- name: Configure lvm backend
  ansible.builtin.include_tasks: configure_backend_lvm.yaml
  when:
    - cinder_worker_name | lower == "lvm"

- name: Cleanup
  ansible.builtin.include_tasks: cleanup.yaml
